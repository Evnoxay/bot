<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DarwinBot Setup</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main>
    <h1>DarwinBot - Assistant Setup</h1>
    <form id="setup-form">
      <input name="DISCORD_TOKEN" placeholder="DISCORD_TOKEN" required />
      <input name="CLIENT_ID" placeholder="CLIENT_ID" required />
      <input name="GUILD_ID" placeholder="GUILD_ID" required />
      <input name="CREATOR_VOICE_CHANNEL_ID" placeholder="CREATOR_VOICE_CHANNEL_ID" required />
      <input name="CATEGORY_ID" placeholder="CATEGORY_ID" required />
      <label><input type="checkbox" name="DEBUG" /> DEBUG</label>
      <button type="submit">Enregistrer</button>
    </form>

    <section>
      <h2>Prévisualisation</h2>
      <pre id="preview"></pre>
    </section>

    <section>
      <h2>Logs</h2>
      <pre id="logs"></pre>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
